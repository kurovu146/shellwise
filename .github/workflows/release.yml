name: release

# Push a version tag (e.g. v0.3.2) → build binaries, publish a GitHub Release,
# and bump the Homebrew tap formula automatically.
# npm publish is done manually (npm publish from the repo root).
#
# Required secret:
#   HOMEBREW_TAP_TOKEN  PAT with write access to the tap repo (classic: `repo`,
#                       or fine-grained: Contents=write on kurovu146/homebrew-tap).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build cross-platform binaries
        run: bash scripts/build-release.sh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.tar.gz \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --repo "$GITHUB_REPOSITORY"

      - name: Update Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          TAP: kurovu146/homebrew-tap
        run: bash scripts/update-formula.sh
