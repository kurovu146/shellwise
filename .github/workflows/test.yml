name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # The Windows leg is mostly process starts (consoles, shells, daemons).
    timeout-minutes: 30
    # No update check (a request to the npm registry) from any CLI a test starts.
    env:
      SHELLWISE_NO_UPDATE_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # Install the shells so the zsh/fish suites actually run on POSIX legs.
      # tmux is not installed here: the Ubuntu image has it, so the tmux suites
      # run on Linux only (the fish frame suite is skipped there, see the test).
      - name: Install zsh and fish (Linux)
        if: runner.os == 'Linux'
        # fish 4 from the fish PPA: the distro still ships 3.x.
        run: sudo add-apt-repository -y ppa:fish-shell/release-4 && sudo apt-get update && sudo apt-get install -y zsh fish
      - name: Install fish (macOS)
        if: runner.os == 'macOS'
        run: brew install fish
      - name: Show detected tools
        run: bun -e "console.log(Object.fromEntries(['zsh','fish','tmux','sh'].map(t => [t, Bun.which(t)])))"
      - name: Show shell versions
        if: runner.os != 'Windows'
        run: zsh --version; fish --version
      - run: bunx tsc --noEmit
      - run: bun test
