name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # Install the shells so the zsh/fish suites actually run on POSIX legs.
      # tmux is deliberately NOT installed: the tmux e2e suites are timing-based
      # and have never run on shared runners, so they stay local-only.
      - name: Install zsh and fish (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh fish
      - name: Install fish (macOS)
        if: runner.os == 'macOS'
        run: brew install fish
      - name: Show detected tools
        run: bun -e "console.log(Object.fromEntries(['zsh','fish','tmux','sh'].map(t => [t, Bun.which(t)])))"
      - run: bun test
